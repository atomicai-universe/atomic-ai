# Alembic configuration for the Atomic AI backend.
#
# The database URL is intentionally NOT set here. env.py reads the DSN at
# runtime from app.config.get_settings().DATABASE_URL.get_secret_value() so the
# secret never appears in a committed file or a log (Req 18.4). The backend
# container runs `alembic upgrade head` from WORKDIR /app (see entrypoint.sh),
# and this file lives at /app/alembic.ini with the migration package below it.

[alembic]
# Path (relative to this file / the invocation dir) to the migration scripts.
script_location = alembic

# Template used to generate migration file names: date + slug for ordering.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Use os.pathsep-separated paths; prepend the current dir so `app` imports work
# when alembic is invoked from /app.
prepend_sys_path = .

# Timezone for file_template timestamps.
timezone = UTC

# Blank sqlalchemy.url: the real DSN is injected by env.py from app.config.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured.

# Logging configuration. Deliberately conservative: alembic's own logger at
# INFO, SQLAlchemy engine at WARNING so DSNs/SQL are not echoed by default.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
